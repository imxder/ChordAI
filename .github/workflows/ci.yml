# Roda em todo push e em todo PR.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 traz o histórico todo, que o SonarCloud usa pra saber o que é
      # código novo e quem mexeu em cada linha.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Instala o Flutter na mesma versão que eu uso, lida do .fvmrc.
      # O cache guarda o SDK entre uma execução e outra.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependências
        run: flutter pub get

      # Para se algum arquivo .dart não estiver no padrão do dart format.
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # O integration_test de equivalência do modelo não roda aqui: ele precisa
      # da biblioteca nativa do TFLite de um aparelho de verdade.
      # O --coverage gera o coverage/lcov.info, que vai pro SonarCloud.
      - name: Testes
        run: flutter test --coverage

      # Confere se os .tflite em assets/models/ são os das releases do backend.
      - name: Hash dos modelos
        run: python3 tool/conferir_modelos.py

      # Manda o código e a cobertura pro SonarCloud. A configuração está no
      # sonar-project.properties. Roda depois do flutter pub get, que a análise
      # de Dart precisa.
      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # O Gradle do Android precisa do Java. O Android SDK já vem no runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      # Gera o APK release do mesmo jeito que a release gera, mas assinado com a
      # chave de debug (aqui não tem a keystore). Serve pra pegar erro do R8 ou
      # do Gradle antes de eu criar uma tag.
      - name: APK release
        run: flutter build apk --release

      - name: Tamanho do APK
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
