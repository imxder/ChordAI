# Quando eu crio uma tag v* (ex.: v0.1.0), gera o APK assinado e publica numa
# GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

# Precisa de escrita no repositório pra criar a release e subir o APK.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 traz o histórico todo e as tags, pra montar as notas com os
      # commits desde a tag anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      # v0.1.0-teste -> versão 0.1.0. Tag com sufixo (tem "-") ou abaixo da v1
      # (começa com 0.) vira pre-release. Da v1.0.0 em diante é release normal.
      - name: Versão da tag
        id: versao
        run: |
          versao="${GITHUB_REF_NAME#v}"
          echo "nome=${versao%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$versao" == *-* || "$versao" == 0.* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      # A keystore fica nos secrets do GitHub, em base64. Aqui ela vira arquivo
      # só durante o build e nunca entra no repositório. Sem os secrets o
      # workflow para, pra não publicar um APK assinado com a chave de debug.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam os secrets da keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependências
        run: flutter pub get

      # Não publica se os modelos não forem os das releases do backend.
      - name: Hash dos modelos
        run: python3 tool/conferir_modelos.py

      # Um APK só, universal (arm, arm64 e x86_64), pra o QR Code apontar pra um
      # arquivo. A versão vem da tag e o número do build é o número da execução.
      - name: APK release
        run: |
          flutter build apk --release \
            --build-name=${{ steps.versao.outputs.nome }} \
            --build-number=${{ github.run_number }}

      # Confere que o APK saiu assinado com a minha chave, não com a de debug.
      - name: Assinatura
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee assinatura.txt
          if grep -q "CN=Android Debug" assinatura.txt; then
            echo "::error::O APK saiu assinado com a chave de debug."
            exit 1
          fi

      # Nome fixo, ChordAI.apk: assim o link .../releases/latest/download/ChordAI.apk
      # sempre aponta pro APK da última release normal.
      - name: Renomeia
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ChordAI.apk
          ls -lh ChordAI.apk

      # As notas são os commits desde a tag anterior (ou desde o começo, na primeira).
      - name: Notas da versão
        run: |
          anterior="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$anterior" ]; then
            intervalo="$anterior..$GITHUB_REF_NAME"
            echo "Commits desde a $anterior:" > notas.md
          else
            intervalo="$GITHUB_REF_NAME"
            echo "Commits até aqui:" > notas.md
          fi
          echo >> notas.md
          git log --no-merges --pretty='- %s' "$intervalo" >> notas.md

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if [ "${{ steps.versao.outputs.pre }}" = "true" ]; then
            extra="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" ChordAI.apk \
            --title "ChordAI $GITHUB_REF_NAME" \
            --notes-file notas.md \
            $extra
