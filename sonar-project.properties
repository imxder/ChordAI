sonar.organization=imxder
sonar.projectKey=imxder_ChordAI
sonar.projectName=ChordAI

# Código que o SonarCloud analisa: o app em Dart e o script que confere o hash dos
# modelos. Os testes ficam separados, em sonar.tests.
sonar.sources=lib,tool
sonar.tests=test,integration_test

# Pastas que o Flutter gera pra cada plataforma, os assets (modelos, músicas,
# fontes de ícone) e o build não são código meu.
sonar.exclusions=android/**,ios/**,windows/**,macos/**,linux/**,web/**,build/**,assets/**,**/*.tflite,**/*.h5,**/*.ttf

# Gerado pelo flutter test --coverage no CI.
sonar.dart.lcov.reportPaths=coverage/lcov.info
