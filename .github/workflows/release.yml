# Quando eu crio uma tag v* (ex.: v0.1.0), gera o APK assinado, o .zip do
# Windows e o .zip do Mac e publica os três numa GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

# Por padrão os jobs só leem o repositório. Quem precisa escrever (criar a
# release e subir os arquivos) pede a permissão no próprio job.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    # Escrita pra criar a release e subir o APK.
    permissions:
      contents: write
    steps:
      # fetch-depth 0 traz o histórico todo e as tags, pra montar as notas com os
      # commits desde a tag anterior.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # O cache: gradle guarda o que o Gradle baixa (plugins, Kotlin) entre uma
      # execução e outra. O plugins.gradle.org às vezes falha no meio do
      # download e derrubava o build; com o cache ele só baixa quando os
      # arquivos .gradle mudam.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      # v0.1.0-teste -> versão 0.1.0. Tag com sufixo (tem "-") ou abaixo da v1
      # (começa com 0.) vira pre-release. Da v1.0.0 em diante é release normal.
      - name: Versão da tag
        id: versao
        run: |
          versao="${GITHUB_REF_NAME#v}"
          echo "nome=${versao%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$versao" == *-* || "$versao" == 0.* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      # A keystore fica nos secrets do GitHub, em base64. Aqui ela vira arquivo
      # só durante o build e nunca entra no repositório. Sem os secrets o
      # workflow para, pra não publicar um APK assinado com a chave de debug.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam os secrets da keystore (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependências
        run: flutter pub get

      # Não publica se os modelos não forem os das releases do backend.
      - name: Hash dos modelos
        run: python3 tool/conferir_modelos.py

      # Um APK só, universal (arm, arm64 e x86_64), pra o QR Code apontar pra um
      # arquivo. A versão vem da tag e o número do build é o número da execução.
      - name: APK release
        run: |
          flutter build apk --release \
            --build-name=${{ steps.versao.outputs.nome }} \
            --build-number=${{ github.run_number }}

      # Confere que o APK saiu assinado com a minha chave, não com a de debug.
      - name: Assinatura
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee assinatura.txt
          if grep -q "CN=Android Debug" assinatura.txt; then
            echo "::error::O APK saiu assinado com a chave de debug."
            exit 1
          fi

      # Nome fixo, ChordAI.apk: assim o link .../releases/latest/download/ChordAI.apk
      # sempre aponta pro APK da última release normal.
      - name: Renomeia
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ChordAI.apk
          ls -lh ChordAI.apk

      # As notas são os commits desde a tag anterior (ou desde o começo, na primeira).
      - name: Notas da versão
        run: |
          anterior="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$anterior" ]; then
            intervalo="$anterior..$GITHUB_REF_NAME"
            echo "Commits desde a $anterior:" > notas.md
          else
            intervalo="$GITHUB_REF_NAME"
            echo "Commits até aqui:" > notas.md
          fi
          echo >> notas.md
          git log --no-merges --pretty='- %s' "$intervalo" >> notas.md

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if [ "${{ steps.versao.outputs.pre }}" = "true" ]; then
            extra="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" ChordAI.apk \
            --title "ChordAI $GITHUB_REF_NAME" \
            --notes-file notas.md \
            $extra

  # O app de Windows num .zip, na mesma release do APK. Espera o job do APK
  # porque é ele que cria a release. Roda no Windows do GitHub porque o build
  # de Windows do Flutter só sai no Windows.
  windows:
    needs: apk
    runs-on: windows-latest
    # Escrita pra subir o .zip na release que o job do APK criou.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependências
        run: flutter pub get

      # Não publica se os modelos não forem os das releases do backend.
      - name: Hash dos modelos
        run: python tool/conferir_modelos.py

      # Mesma versão do APK: v0.3.0 -> 0.3.0, e o número da execução como build.
      - name: Build
        run: |
          $versao = $env:GITHUB_REF_NAME.Substring(1).Split('-')[0]
          flutter build windows --release --build-name=$versao --build-number=${{ github.run_number }}

      # Sem a DLL do modelo o app não reconhece acorde, e sem o runtime do
      # Visual C++ ele nem abre num PC que não tem. Os dois vêm das regras do
      # windows/CMakeLists.txt; se algum faltar, para aqui.
      - name: Confere a pasta
        run: |
          $pasta = 'build/windows/x64/runner/Release'
          foreach ($arquivo in 'chordai.exe', 'blobs/libtensorflowlite_c-win.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            if (-not (Test-Path "$pasta/$arquivo")) {
              Write-Output "::error::Faltou $arquivo na pasta Release."
              exit 1
            }
          }
          Get-ChildItem $pasta | Format-Table Name, Length

      # A pasta inteira vira ChordAI/ dentro do .zip. Nome fixo, ChordAI-windows.zip:
      # assim o link .../releases/latest/download/ChordAI-windows.zip sempre
      # aponta pro da última release normal.
      - name: Zip
        run: |
          New-Item -ItemType Directory ChordAI | Out-Null
          Copy-Item build/windows/x64/runner/Release/* ChordAI -Recurse
          Compress-Archive -Path ChordAI -DestinationPath ChordAI-windows.zip
          Get-Item ChordAI-windows.zip | Format-Table Name, Length

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME ChordAI-windows.zip

  # O app de Mac num .zip, na mesma release. Roda no Mac do GitHub porque o
  # build de macOS do Flutter só sai no Mac. O app sai universal (Apple Silicon
  # e Intel) e com assinatura ad-hoc, sem conta paga da Apple.
  macos:
    needs: apk
    runs-on: macos-latest
    # Escrita pra subir o .zip na release que o job do APK criou.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Dependências
        run: flutter pub get

      # Não publica se os modelos não forem os das releases do backend.
      - name: Hash dos modelos
        run: python3 tool/conferir_modelos.py

      # Mesma versão do APK: v0.3.0 -> 0.3.0, e o número da execução como build.
      - name: Build
        run: |
          versao="${GITHUB_REF_NAME#v}"
          flutter build macos --release --build-name="${versao%%-*}" --build-number=${{ github.run_number }}

      # Sem a dylib do modelo o app abre mas não reconhece acorde. Ela tem que
      # estar em Contents/Resources (onde o tflite_flutter procura) e ter as duas
      # arquiteturas, igual ao app.
      - name: Confere o app
        run: |
          app=build/macos/Build/Products/Release/ChordAI.app
          dylib="$app/Contents/Resources/libtensorflowlite_c-mac.dylib"
          if [ ! -f "$dylib" ]; then
            echo "::error::Faltou a dylib do modelo em Contents/Resources."
            exit 1
          fi
          for binario in "$app/Contents/MacOS/ChordAI" "$dylib"; do
            arquiteturas="$(lipo -archs "$binario")"
            echo "$binario: $arquiteturas"
            if [[ "$arquiteturas" != *arm64* || "$arquiteturas" != *x86_64* ]]; then
              echo "::error::$binario não é universal."
              exit 1
            fi
          done
          codesign --verify --deep --strict "$app"

      # O ditto guarda os atributos e a assinatura do .app dentro do .zip (o zip
      # comum estraga). Nome fixo, ChordAI-macos.zip: assim o link
      # .../releases/latest/download/ChordAI-macos.zip sempre aponta pro da
      # última release normal.
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/ChordAI.app ChordAI-macos.zip
          ls -lh ChordAI-macos.zip

      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ChordAI-macos.zip
