sonar.organization=imxder
sonar.projectKey=imxder_ChordAI
sonar.projectName=ChordAI

# O SonarCloud analisa o projeto inteiro (sonar.sources não tem mais efeito), então
# o que limita a análise são as exclusões: as pastas que o Flutter gera pra cada
# plataforma, os assets (modelos, músicas, fontes de ícone) e o build não são código meu.
sonar.exclusions=android/**,ios/**,windows/**,macos/**,linux/**,web/**,build/**,assets/**,**/*.tflite,**/*.h5,**/*.ttf

# O tool/conferir_modelos.py roda no Python 3 do runner.
sonar.python.version=3

# Gerado pelo flutter test --coverage no CI.
sonar.dart.lcov.reportPaths=coverage/lcov.info
